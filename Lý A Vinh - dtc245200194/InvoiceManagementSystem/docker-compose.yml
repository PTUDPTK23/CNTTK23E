services:
  postgres:
    image: postgres:16
    container_name: invoice-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoicemanagementsystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CHANGE_ME"
    ports:
      - "5432:5432"
    volumes:
      - invoice-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoicemanagementsystem"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  invoice-postgres-data:
