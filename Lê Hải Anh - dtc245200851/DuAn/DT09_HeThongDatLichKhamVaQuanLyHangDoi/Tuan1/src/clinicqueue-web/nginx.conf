server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://api:8080; }
 location = /health/api { proxy_pass http://api:8080/health; }
 location = /health/notification { proxy_pass http://notification:8080/health; }
 location = /health { access_log off; default_type text/plain; return 200 'Healthy'; }
 # /hubs proxy is introduced alongside authenticated SignalR in M4.
}
