name: Build and integration
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore NotifyLab.sln --locked-mode
      - run: dotnet build NotifyLab.sln -c Release --no-restore
      - run: dotnet run --project tests/Notification.Tests -c Release --no-build
      - run: docker compose config --quiet
      - run: docker compose up -d --build --scale notification-worker=2
      - run: python scripts/integration.py --faults
      - if: always()
        run: docker compose logs --no-color > compose-test.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-log
          path: compose-test.log
      - if: always()
        run: docker compose down
