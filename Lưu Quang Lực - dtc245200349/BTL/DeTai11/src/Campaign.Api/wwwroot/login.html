<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · NotifyLab</title>
  <link rel="stylesheet" href="/styles.css?v=admin-audit">
  <script src="/login.js?v=admin-audit" defer></script>
</head>
<body class="login-page">
  <main class="panel login-panel">
    <div class="wordmark"><span class="mark" aria-hidden="true">✉</span>NotifyLab</div>
    <h1>Đăng nhập quản trị</h1>
    <form id="login-form" method="post" action="/auth/login">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" required maxlength="120" autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button id="login-submit" type="submit" class="primary">Đăng nhập</button>
    </form>
  </main>
</body>
</html>
