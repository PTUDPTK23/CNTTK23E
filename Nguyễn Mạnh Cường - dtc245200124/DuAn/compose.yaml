services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: distributed_orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d distributed_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-api:
    build:
      context: .
      dockerfile: OrderApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrdersDb: Host=postgres;Port=5432;Database=distributed_orders;Username=orders;Password=orders
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-worker:
    build:
      context: .
      dockerfile: OrderWorker/Dockerfile
    environment:
      ConnectionStrings__OrdersDb: Host=postgres;Port=5432;Database=distributed_orders;Username=orders;Password=orders
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
