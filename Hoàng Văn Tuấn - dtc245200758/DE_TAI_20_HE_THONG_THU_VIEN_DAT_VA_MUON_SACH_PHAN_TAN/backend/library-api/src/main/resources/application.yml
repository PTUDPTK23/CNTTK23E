server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: library-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/library_db}
    username: ${DB_USER:library_user}
    password: ${DB_PASSWORD}          # bắt buộc đặt qua biến môi trường, không hardcode
  jpa:
    hibernate:
      ddl-auto: none                  # schema do Flyway quản lý
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:library_admin}
    password: ${RABBIT_PASSWORD}
    publisher-confirm-type: correlated   # để Outbox publisher chờ xác nhận từ broker
  jackson:
    default-property-inclusion: always

app:
  loan:
    days: 14
  reservation:
    hold-hours: 48              # quá hạn nhận sách -> tự động hủy
    expiry-interval-ms: 60000
  outbox:
    poll-interval-ms: 1000
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

management:
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info
