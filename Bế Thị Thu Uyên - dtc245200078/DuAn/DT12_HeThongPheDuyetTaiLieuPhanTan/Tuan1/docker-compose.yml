services:
  postgresdb:
    image: postgres:15-alpine
    container_name: document_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: DocumentApprovalDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - document_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: document_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Port giao tiếp của RabbitMQ
      - "15672:15672" # Port giao diện quản lý (Web UI)
    networks:
      - document_network

  document-api:
    build: ./DocumentApi
    container_name: document_api
    ports:
      - "5215:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgresdb;Port=5432;Database=DocumentApprovalDb;Username=admin;Password=123
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      - postgresdb
      - rabbitmq
    networks:
      - document_network

  document-worker:
    build: ./DocumentWorker
    container_name: document_worker
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      - rabbitmq
    networks:
      - document_network

networks:
  document_network:
    driver: bridge

volumes:
  postgres_data: