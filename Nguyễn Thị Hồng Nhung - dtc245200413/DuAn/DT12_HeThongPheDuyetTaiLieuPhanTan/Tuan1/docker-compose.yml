services:
  postgres:
    image: postgres:16-alpine
    container_name: doc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-document_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - doc-approval-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: doc-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - doc-approval-net

  document-api:
    build:
      context: ./src/DocumentApi
      dockerfile: Dockerfile
    container_name: doc-document-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=document_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS:-guest}
      RabbitMQ__Exchange: document.events
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - doc-approval-net

  notification-service:
    build:
      context: ./src/NotificationService
      dockerfile: Dockerfile
    container_name: doc-notification-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=notification_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS:-guest}
      RabbitMQ__Exchange: document.events
      RabbitMQ__Queue: notification.queue
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - doc-approval-net

  client-web:
    build:
      context: ./src/ClientWeb
      dockerfile: Dockerfile
    container_name: doc-client-web
    environment:
      ASPNETCORE_URLS: http://+:8080
      Services__DocumentApiUrl: http://document-api:8080
      Services__NotificationServiceUrl: http://notification-service:8080
    ports:
      - "5000:8080"
    depends_on:
      - document-api
      - notification-service
    networks:
      - doc-approval-net

volumes:
  postgres_data:

networks:
  doc-approval-net:
    driver: bridge
