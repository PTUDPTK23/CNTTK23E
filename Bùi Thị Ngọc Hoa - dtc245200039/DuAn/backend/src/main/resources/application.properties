# ==============================================================================
# ĐỀ TÀI 11: HỆ THỐNG GỬI THÔNG BÁO HÀNG LOẠT
# Application Configuration
# ==============================================================================

server.port=8080
server.servlet.context-path=

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static resources (Phục vụ giao diện Frontend trực tiếp từ Spring Boot)
spring.web.resources.static-locations=classpath:/static/

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Email SMTP Configuration
# Hướng dẫn: Nếu có tài khoản Gmail SMTP, cấu hình SMTP_USERNAME và SMTP_PASSWORD (Mật khẩu ứng dụng 16 ký tự).
# Nếu để trống hoặc đặt APP_MAIL_SIMULATION=true, hệ thống sẽ tự động kích hoạt chế độ mô phỏng gửi (Simulation Mode)
# và ghi nhận trạng thái SIMULATED vào lịch sử (không giả mạo trạng thái email thực tế).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cấu hình chế độ mô phỏng và thông tin gửi
app.mail.simulation-mode=${APP_MAIL_SIMULATION:true}
app.mail.from-email=${SMTP_FROM:no-reply@notification.vn}
app.mail.from-name=${SMTP_FROM_NAME:Hệ Thống Gửi Thông Báo}

# Scheduler Configuration (Kiểm tra chiến dịch hẹn giờ định kỳ mỗi 15 giây)
app.campaign.scheduler.enabled=true
