services:
  postgres:
    image: postgres:16-alpine
    container_name: doc-approval-postgres
    environment:
      POSTGRES_DB: document_approval_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_approval_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - distributed-doc-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: doc-approval-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - distributed-doc-net

  document-api:
    build:
      context: .
      dockerfile: src/DocumentApi/Dockerfile
    container_name: doc-approval-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=document_approval_db;Username=postgres;Password=postgres
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - distributed-doc-net

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: doc-approval-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    ports:
      - "5002:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - distributed-doc-net

  web-client:
    build:
      context: .
      dockerfile: src/WebClient/Dockerfile
    container_name: doc-approval-client
    environment:
      PUBLIC_DOCUMENT_API_URL: http://localhost:5001
      PUBLIC_NOTIFICATION_URL: http://localhost:5002
    ports:
      - "3000:8080"
    depends_on:
      - document-api
      - notification-service
    restart: unless-stopped
    networks:
      - distributed-doc-net

volumes:
  postgres_data:

networks:
  distributed-doc-net:
    driver: bridge
