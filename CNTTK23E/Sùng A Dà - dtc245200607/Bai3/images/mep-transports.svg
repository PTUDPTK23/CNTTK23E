<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
  <title id="t">MEP và transport của SignalR</title><desc id="d">Polling, Push và Streaming là các mô hình giao tiếp. SignalR thương lượng transport và ưu tiên WebSocket, có Server-Sent Events và Long Polling làm phương án khác.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f7ff"/><stop offset="1" stop-color="#f1f6fb"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#8f82c6"/></marker></defs>
  <rect x="1" y="1" width="1198" height="388" rx="16" fill="url(#bg)" stroke="#e8e4f4"/>
  <text x="32" y="38" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" font-weight="700" fill="#8279a8">MÔ HÌNH GIAO TIẾP · MEP</text>
  <g font-family="Arial,sans-serif">
    <rect x="32" y="63" width="348" height="125" rx="12" fill="#fff" stroke="#e6e5ef"/><text x="55" y="94" font-size="17" font-weight="700" fill="#282641">Polling</text><text x="55" y="119" font-size="12" fill="#72768a">Máy khách hỏi máy chủ theo chu kỳ.</text><path d="M59 151h112m0 0-8-7m8 7-8 7" stroke="#7a68d4" stroke-width="2" fill="none"/><path d="M210 151H98m0 0 8-7m-8 7 8 7" stroke="#b6b0d2" stroke-width="2" fill="none"/><text x="181" y="155" font-size="10" fill="#9693aa">lặp lại</text>
    <rect x="426" y="63" width="348" height="125" rx="12" fill="#fff" stroke="#e6e5ef"/><text x="449" y="94" font-size="17" font-weight="700" fill="#282641">Push</text><text x="449" y="119" font-size="12" fill="#72768a">Máy chủ gửi khi có thay đổi.</text><path d="M456 151h230m0 0-8-7m8 7-8 7" stroke="#28a77c" stroke-width="2" fill="none"/><circle cx="466" cy="151" r="5" fill="#28a77c"/><text x="553" y="144" font-size="10" fill="#9693aa">sự kiện mới</text>
    <rect x="820" y="63" width="348" height="125" rx="12" fill="#fff" stroke="#e6e5ef"/><text x="843" y="94" font-size="17" font-weight="700" fill="#282641">Streaming</text><text x="843" y="119" font-size="12" fill="#72768a">Trao đổi dữ liệu liên tục trên luồng mở.</text><path d="M849 151h250" stroke="#598bd0" stroke-width="3" stroke-linecap="round"/><circle cx="882" cy="151" r="4" fill="#598bd0"/><circle cx="930" cy="151" r="4" fill="#598bd0"/><circle cx="978" cy="151" r="4" fill="#598bd0"/><circle cx="1026" cy="151" r="4" fill="#598bd0"/>
  </g>
  <rect x="32" y="220" width="222" height="112" rx="12" fill="#2d2848"/><text x="55" y="254" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">SignalR</text><text x="55" y="278" font-family="Arial,sans-serif" font-size="11" fill="#d8d2f1">Hub · connection · group</text><text x="55" y="302" font-family="Arial,sans-serif" font-size="10" fill="#ada5ce">Negotiate transport</text>
  <path d="M255 276h58" stroke="#8f82c6" stroke-width="2" marker-end="url(#a)"/>
  <g font-family="Arial,sans-serif"><rect x="326" y="220" width="244" height="112" rx="12" fill="#fff" stroke="#e6e5ef"/><rect x="591" y="220" width="244" height="112" rx="12" fill="#fff" stroke="#e6e5ef"/><rect x="856" y="220" width="312" height="112" rx="12" fill="#fff" stroke="#e6e5ef"/><circle cx="352" cy="250" r="6" fill="#28a77c"/><text x="370" y="255" font-size="15" font-weight="700" fill="#282641">WebSocket</text><text x="350" y="285" font-size="10" fill="#82869a">Kênh hai chiều khi khả dụng</text><circle cx="617" cy="250" r="6" fill="#598bd0"/><text x="635" y="255" font-size="15" font-weight="700" fill="#282641">Server-Sent Events</text><text x="615" y="285" font-size="10" fill="#82869a">Một transport fallback</text><circle cx="882" cy="250" r="6" fill="#d6a544"/><text x="900" y="255" font-size="15" font-weight="700" fill="#282641">Long Polling</text><text x="880" y="285" font-size="10" fill="#82869a">Fallback khi transport khác không dùng được</text></g>
  <path d="M291 276h21m267 0h20m245 0h21" stroke="#8f82c6" stroke-width="2" marker-end="url(#a)" fill="none"/>
</svg>
