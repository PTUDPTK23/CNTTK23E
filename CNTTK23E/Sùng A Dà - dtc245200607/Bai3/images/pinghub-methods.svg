<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Các kiểu gửi trong PingHub</title><desc id="d">Echo trả về Caller, Broadcast gửi All, JoinGroup thêm connection vào Group, SendToGroup gửi cho Group và lifecycle phát SystemMessage.</desc>
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="#f8f7fc" stroke="#ece9f4"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.4" font-weight="700" fill="#8279a8">PINGHUB · PHẠM VI NGƯỜI NHẬN</text>
  <g font-family="Arial,sans-serif">
    <rect x="30" y="66" width="260" height="130" rx="13" fill="#fff" stroke="#e6e4ef"/><text x="52" y="98" font-size="16" font-weight="700" fill="#282641">Echo</text><text x="52" y="122" font-size="11" fill="#767a8e">Echo(message)</text><text x="52" y="151" font-size="11" fill="#6e57d6">Clients.Caller</text><text x="52" y="173" font-size="10" fill="#9a9cad">chỉ trả về máy khách gọi</text>
    <rect x="320" y="66" width="260" height="130" rx="13" fill="#fff" stroke="#e6e4ef"/><text x="342" y="98" font-size="16" font-weight="700" fill="#282641">Broadcast</text><text x="342" y="122" font-size="11" fill="#767a8e">Broadcast(message)</text><text x="342" y="151" font-size="11" fill="#249b76">Clients.All</text><text x="342" y="173" font-size="10" fill="#9a9cad">gửi tới mọi kết nối</text>
    <rect x="610" y="66" width="260" height="130" rx="13" fill="#fff" stroke="#e6e4ef"/><text x="632" y="98" font-size="16" font-weight="700" fill="#282641">JoinGroup</text><text x="632" y="122" font-size="11" fill="#767a8e">Groups.AddToGroupAsync</text><text x="632" y="151" font-size="11" fill="#5187c8">ConnectionId → group</text><text x="632" y="173" font-size="10" fill="#9a9cad">ví dụ: lop-hoc-01</text>
    <rect x="900" y="66" width="270" height="130" rx="13" fill="#fff" stroke="#e6e4ef"/><text x="922" y="98" font-size="16" font-weight="700" fill="#282641">SendToGroup</text><text x="922" y="122" font-size="11" fill="#767a8e">Clients.Group(name)</text><text x="922" y="151" font-size="11" fill="#5187c8">GroupMessage</text><text x="922" y="173" font-size="10" fill="#9a9cad">gửi các thành viên cùng nhóm</text>
    <rect x="30" y="224" width="1140" height="98" rx="13" fill="#2c2746"/><text x="55" y="259" font-size="14" font-weight="700" fill="#fff">Connection lifecycle</text><text x="55" y="285" font-size="10" fill="#c8c2df">OnConnectedAsync / OnDisconnectedAsync</text><path d="M365 274h100m0 0-8-6m8 6-8 6" stroke="#b0a3f2" stroke-width="2" fill="none"/><rect x="486" y="248" width="188" height="45" rx="9" fill="#473e6d"/><text x="510" y="276" font-size="12" fill="#e5e0ff">SystemMessage</text><path d="M685 274h86m0 0-8-6m8 6-8 6" stroke="#b0a3f2" stroke-width="2" fill="none"/><text x="790" y="270" font-size="11" fill="#c8c2df">Clients.All</text><text x="790" y="289" font-size="10" fill="#a8a0c5">thông báo kết nối / ngắt kết nối</text>
  </g>
</svg>
