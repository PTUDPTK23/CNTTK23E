<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Luồng REST + SignalR trong EduSubmit</title>
  <desc id="desc">Máy khách tạo lượt nộp bằng REST. Bộ chấm đổi trạng thái received sang processing, sau đó graded hoặc failed. IHubContext gửi SubmissionStatusChanged đến nhóm submission có ID tương ứng. Máy khách đọc trạng thái bằng REST.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#f3f5fb"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#9389bc"/></marker>
    <marker id="push" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2aa980"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#332b58" flood-opacity=".1"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="url(#canvas)" stroke="#eceaf4"/>
  <text x="30" y="32" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#9993b3">REST · GHI NHẬN LƯỢT NỘP</text>
  <text x="530" y="32" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#9993b3">SIGNALR · ĐẨY TRẠNG THÁI</text>
  <g filter="url(#shadow)">
    <rect x="28" y="55" width="220" height="155" rx="12" fill="#fff" stroke="#e8e5f3"/>
    <rect x="47" y="73" width="31" height="31" rx="8" fill="#f0edff"/>
    <path d="M55 81h15v14H55zM59 78h15v14" fill="none" stroke="#7258e9" stroke-width="1.6"/>
    <text x="89" y="87" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#292841">Máy khách</text>
    <text x="89" y="102" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">HttpClient + HubConnection</text>
    <rect x="46" y="119" width="184" height="42" rx="7" fill="#f7f6fc"/>
    <text x="57" y="136" font-family="Consolas,monospace" font-size="9" fill="#6552bd">POST /api/assignments/{id}</text>
    <text x="57" y="151" font-family="Consolas,monospace" font-size="9" fill="#6552bd">/submissions · 201 Created</text>
    <text x="47" y="184" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">WatchSubmission(id)</text>

    <rect x="300" y="55" width="195" height="155" rx="12" fill="#fff" stroke="#e8e5f3"/>
    <rect x="319" y="73" width="31" height="31" rx="8" fill="#eaf4ff"/>
    <path d="M327 81h15v14h-15zM330 78h9" fill="none" stroke="#4c89d1" stroke-width="1.6"/>
    <text x="361" y="87" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#292841">Submission API</text>
    <text x="319" y="128" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">Tạo lượt nộp, trạng thái ban đầu</text>
    <rect x="319" y="142" width="156" height="35" rx="8" fill="#fff6e8"/>
    <circle cx="337" cy="159" r="5" fill="#dfa943"/>
    <text x="350" y="163" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#bd8c37">received</text>
    <text x="319" y="194" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">GET /api/submissions/{id}</text>

    <rect x="548" y="55" width="190" height="155" rx="12" fill="#fff" stroke="#e8e5f3"/>
    <rect x="567" y="73" width="31" height="31" rx="8" fill="#e9f8f1"/>
    <path d="M575 89a7 7 0 0 1 12-5l2 2m0-5v5h-5M589 89a7 7 0 0 1-12 5l-2-2m0 5v-5h5" fill="none" stroke="#25a77b" stroke-width="1.4" stroke-linecap="round"/>
    <text x="609" y="87" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#292841">Bộ chấm bài</text>
    <text x="567" y="128" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">Task.Delay · đổi trạng thái</text>
    <rect x="567" y="143" width="79" height="28" rx="7" fill="#edf4ff"/>
    <text x="578" y="161" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#5887c8">processing</text>
    <path d="M649 157h13" stroke="#c4bddf" marker-end="url(#arrow)"/>
    <rect x="666" y="143" width="59" height="28" rx="7" fill="#e9f8f1"/>
    <text x="676" y="161" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#259a72">graded</text>
    <text x="567" y="191" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">hoặc failed</text>

    <rect x="792" y="55" width="203" height="155" rx="12" fill="#2c2746"/>
    <rect x="811" y="73" width="31" height="31" rx="8" fill="#473e6d"/>
    <path d="M819 82h15v12h-15zM823 78h7" fill="none" stroke="#c1b3ff" stroke-width="1.5"/>
    <text x="853" y="87" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">IHubContext</text>
    <text x="811" y="127" font-family="Consolas,monospace" font-size="9" fill="#d5cdff">Clients.Group(</text>
    <text x="811" y="143" font-family="Consolas,monospace" font-size="9" fill="#a99aff">"submission:{id}"</text>
    <text x="811" y="167" font-family="Arial,sans-serif" font-size="9" fill="#d5cdff">SendAsync</text>
    <text x="811" y="187" font-family="Arial,sans-serif" font-size="9" fill="#b8b3cb">SubmissionStatusChanged</text>

    <rect x="1047" y="55" width="151" height="155" rx="12" fill="#fff" stroke="#e8e5f3"/>
    <rect x="1065" y="73" width="31" height="31" rx="8" fill="#f0edff"/>
    <path d="M1073 81h15v13h-15zM1077 98h7" fill="none" stroke="#7258e9" stroke-width="1.5"/>
    <text x="1106" y="87" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#292841">SignalR client</text>
    <text x="1065" y="128" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">On&lt;SubmissionStatusMessage&gt;</text>
    <text x="1065" y="151" font-family="Arial,sans-serif" font-size="9" fill="#25a77b">processing → graded</text>
    <text x="1065" y="179" font-family="Arial,sans-serif" font-size="9" fill="#8c8fa2">đọc lại bằng REST</text>
    <text x="1065" y="195" font-family="Consolas,monospace" font-size="8" fill="#6552bd">GET /api/submissions/{id}</text>
  </g>
  <path d="M249 132h48M496 132h47M739 132h48M996 132h47" fill="none" stroke="#948abd" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M897 212v50H104v-47" fill="none" stroke="#2aa980" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#push)"/>
  <rect x="435" y="246" width="337" height="27" rx="13" fill="#eaf8f2"/>
  <text x="603" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#258f6c">REST lưu và đọc trạng thái · SignalR thông báo trạng thái mới</text>
</svg>
