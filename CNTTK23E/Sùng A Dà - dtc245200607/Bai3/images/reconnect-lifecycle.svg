<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Vòng đời reconnect của SignalR</title><desc id="d">HubConnection kết nối, phát hiện đứt kết nối, phát Reconnecting, thử kết nối lại, phát Reconnected với ID mới hoặc Closed nếu hết lần thử.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#8e84bc"/></marker></defs>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#f8f7fc" stroke="#ece9f4"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.4" font-weight="700" fill="#8279a8">WITHAUTOMATICRECONNECT · HUBCONNECTION</text>
  <g font-family="Arial,sans-serif">
    <rect x="34" y="91" width="190" height="83" rx="12" fill="#eaf8f2" stroke="#d8f0e5"/><text x="58" y="124" font-size="15" font-weight="700" fill="#258f6c">Connected</text><text x="58" y="148" font-size="10" fill="#688f80">StartAsync() thành công</text>
    <rect x="287" y="91" width="190" height="83" rx="12" fill="#fff6e8" stroke="#f3e8d4"/><text x="311" y="124" font-size="15" font-weight="700" fill="#bb8e42">Connection lost</text><text x="311" y="148" font-size="10" fill="#9c8f79">mạng hoặc server gián đoạn</text>
    <rect x="540" y="91" width="190" height="83" rx="12" fill="#edf4ff" stroke="#e1ebfa"/><text x="564" y="124" font-size="15" font-weight="700" fill="#5584c2">Reconnecting</text><text x="564" y="148" font-size="10" fill="#7f91a8">callback báo đang thử lại</text>
    <rect x="793" y="91" width="190" height="83" rx="12" fill="#eaf8f2" stroke="#d8f0e5"/><text x="817" y="124" font-size="15" font-weight="700" fill="#258f6c">Reconnected</text><text x="817" y="148" font-size="10" fill="#688f80">callback nhận ConnectionId mới</text>
    <rect x="1020" y="208" width="150" height="55" rx="10" fill="#fff0f1" stroke="#f6dfe2"/><text x="1040" y="233" font-size="13" font-weight="700" fill="#cd6c79">Closed</text><text x="1040" y="250" font-size="9" fill="#9e8185">hết lần thử lại</text>
  </g>
  <path d="M225 132h55m195 0h55m195 0h55m195 0h55" stroke="#8e84bc" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M888 181v48H128v-48" stroke="#2aa980" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/>
  <path d="M735 172 1030 216" stroke="#d27680" stroke-width="1.7" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/>
</svg>
